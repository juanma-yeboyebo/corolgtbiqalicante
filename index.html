<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Coro LGTBIQ+ Alicante</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div id="loginScreen" class="login-container">
        <div class="login-box">
            <div class="arcoiris"></div>
            <div class="logo-section">
                <h1>Coro LGTBIQ+ Alicante</h1>
                <p class="subtitle">Área privada</p>
            </div>
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-login">Entrar</button>
                <p class="error-message" id="errorMessage"></p>
            </form>
        </div>
    </div>

    <div id="appScreen" class="app-container" style="display: none;">
        <header class="header">
            <div class="header-content">
                <h1>Coro LGTBIQ+ Alicante</h1>
                <label class="search-box">
                    <svg class="icono" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    <input type="search" id="searchInput" placeholder="Buscar canción" class="search-input">
                </label>
            </div>
            <div class="arcoiris"></div>
        </header>

        <main class="content">
            <h2 class="songs-title">Canciones</h2>
            <div id="songsList" class="songs-grid"></div>
        </main>

        <div id="songModal" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalSongTitle"></h2>
                    <button class="modal-close" aria-label="Cerrar">
                        <svg class="icono" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    </button>
                </div>

                <div class="tabs">
                    <button class="tab-btn active" data-tab="guion">Guión/Letra</button>
                    <button class="tab-btn" data-tab="audio">Audio</button>
                    <button class="tab-btn" data-tab="partitura">Partitura</button>
                </div>

                <div id="guion-tab" class="tab-content active">
                    <div id="guionContainer" class="file-list"></div>
                </div>
                <div id="audio-tab" class="tab-content">
                    <div id="audioContainer" class="file-list"></div>
                </div>
                <div id="partitura-tab" class="tab-content">
                    <div id="partituraContainer" class="file-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="canciones.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
