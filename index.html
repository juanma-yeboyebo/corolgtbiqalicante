<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coro LGTBIQ+ Alicante - Área Privada</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/extras.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-container">
        <div class="login-box">
            <div class="logo-section">
                <h1>🏳️‍🌈 Coro LGTBIQ+ Alicante</h1>
                <p class="subtitle">Área privada de miembros</p>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Ingresa la contraseña" 
                        required
                    >
                </div>
                <button type="submit" class="btn-login">Acceder</button>
                <p class="error-message" id="errorMessage"></p>
            </form>
        </div>
    </div>

    <!-- Main App Screen -->
    <div id="appScreen" class="app-container" style="display: none;">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>🏳️‍🌈 Coro LGTBIQ+ Alicante</h1>
                <div class="header-controls">
                    <div class="search-box">
                        <input 
                            type="text" 
                            id="searchInput" 
                            placeholder="🔍 Buscar canción..."
                            class="search-input"
                        >
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="content">
            <!-- Songs List -->
            <section class="songs-section">
                <h2>Canciones</h2>
                <div id="songsList" class="songs-grid">
                    <!-- Las canciones se cargarán aquí -->
                </div>
            </section>
        </main>

        <!-- Song Detail Modal -->
        <div id="songModal" class="modal" style="display: none;">
            <div class="modal-content">
                <button class="modal-close">&times;</button>
                
                <div class="song-detail">
                    <h2 id="modalSongTitle"></h2>
                    
                    <!-- Tabs -->
                    <div class="tabs">
                        <button class="tab-btn active" data-tab="guion">Guión/Letra</button>
                        <button class="tab-btn" data-tab="audio">Audio</button>
                        <button class="tab-btn" data-tab="partitura">Partitura</button>
                    </div>

                    <!-- Tab Contents -->
                    <div class="tab-contents">
                        <!-- Guión Tab -->
                        <div id="guion-tab" class="tab-content active">
                            <div id="guionContainer" class="file-container">
                                <p class="loading">Cargando guión...</p>
                            </div>
                        </div>

                        <!-- Audio Tab -->
                        <div id="audio-tab" class="tab-content">
                            <div id="audioContainer" class="audio-container">
                                <!-- Los audios se cargarán aquí -->
                            </div>
                        </div>

                        <!-- Partitura Tab -->
                        <div id="partitura-tab" class="tab-content">
                            <div id="partituraContainer" class="file-container">
                                <p class="loading">Cargando partitura...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="canciones.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
